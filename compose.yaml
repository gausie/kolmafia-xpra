services:
  kolmafia:
    image: ghcr.io/gausie/kolmafia-xpra:${XPRA_CHANNEL:-stable}
    build:
      context: .
      args:
        XPRA_CHANNEL: ${XPRA_CHANNEL:-stable}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      KOLMAFIA_UI_SCALE: ${KOLMAFIA_UI_SCALE:-1}
      JAVA_OPTS: ${JAVA_OPTS:-}
      KOLMAFIA_PUBLIC_URL: ${KOLMAFIA_PUBLIC_URL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${XPRA_PORT:-14500}:14500"
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ${KOLMAFIA_DIR:-./data}:/home/kolmafia/.kolmafia
      - jars:/home/kolmafia/jars
    shm_size: 256m

volumes:
  jars:
