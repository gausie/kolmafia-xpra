<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Inter is the closest freely licensed match for San Francisco, which is what KoLmafia uses on
     macOS. Java's logical Dialog/SansSerif fonts resolve through this alias. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <!-- macOS draws text a little heavier than its outlines while Java's rasteriser doesn't, so
       regular Inter looks faded next to the native app. Medium makes up the difference. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Inter</string></test>
    <test name="weight" compare="eq"><const>regular</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
</fontconfig>
